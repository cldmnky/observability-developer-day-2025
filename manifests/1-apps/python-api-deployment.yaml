---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-api
  namespace: observability-demo
  labels:
    app: python-api
    app.kubernetes.io/name: python-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: observability-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-api
  template:
    metadata:
      labels:
        app: python-api
        app.kubernetes.io/name: python-api
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: observability-stack
        demo: observability
    spec:
      containers:
      - name: python-api
        image: quay.io/cldmnky/observability-python-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 4004
          protocol: TCP
          name: http
        env:
        - name: PORT
          value: "4004"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 4004
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 4004
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: python-api
  namespace: observability-demo
  labels:
    app: python-api
    app.kubernetes.io/name: python-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: observability-stack
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 4004
    protocol: TCP
    name: http
  selector:
    app: python-api
