---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-api
  namespace: observability-demo
  labels:
    app: go-api
    app.kubernetes.io/name: go-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: observability-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-api
  template:
    metadata:
      annotations:
        sidecar.opentelemetry.io/inject: sidecar
      labels:
        app: go-api
        app.kubernetes.io/name: go-api
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: observability-stack
    spec:
      serviceAccountName: otel-collector-sidecar
      containers:
      - name: go-api
        image: quay.io/cldmnky/observability-go-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 4001
          protocol: TCP
          name: http
        env:
        - name: PORT
          value: "4001"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "localhost:4318"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 4001
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 4001
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: go-api
  namespace: observability-demo
  labels:
    app: go-api
    app.kubernetes.io/name: go-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: observability-stack
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 4001
    protocol: TCP
    name: http
  selector:
    app: go-api
