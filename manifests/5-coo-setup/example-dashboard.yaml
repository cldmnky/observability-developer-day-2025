---
# Example Perses Dashboard for Observability Demo Applications
# This dashboard visualizes metrics from the 4 demo microservices
# Using v1alpha1 (cluster supports this version)
apiVersion: perses.dev/v1alpha1
kind: PersesDashboard
metadata:
  name: observability-demo-overview
  namespace: openshift-cluster-observability-operator
  labels:
    app.kubernetes.io/name: observability-demo
    monitoring.rhobs/stack: observability-stack
spec:
  display:
    name: "Observability Demo - Application Overview"
    description: "Overview of Go, Python, Quarkus, and Node.js microservices"
  duration: 1h
  variables:
    - kind: ListVariable
      spec:
        name: namespace
        allowAllValue: false
        allowMultiple: false
        display:
          hidden: false
          name: Namespace
          description: Application namespace
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: namespace
            matchers:
              - 'up{namespace="observability-demo"}'
        sort: alphabetical-asc
  panels:
    # Row 1, Column 1: HTTP Request Rate
    "0_0":
      kind: Panel
      spec:
        display:
          name: "HTTP Request Rate"
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
              values: []
            visual:
              areaOpacity: 0
              connectNulls: false
              display: line
              lineWidth: 1
            yAxis:
              format:
                unit: decimal
              min: 0
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: observability-demo-prometheus
                  query: 'sum by (job) (rate(http_request_duration_seconds_count{namespace="$namespace"}[5m]))'
                  seriesNameFormat: "{{job}}"
    
    # Row 1, Column 2: HTTP P95 Latency
    "0_1":
      kind: Panel
      spec:
        display:
          name: "HTTP P95 Latency"
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
              values: []
            visual:
              areaOpacity: 0
              connectNulls: false
              display: line
              lineWidth: 1
            yAxis:
              format:
                unit: seconds
              min: 0
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: observability-demo-prometheus
                  query: 'histogram_quantile(0.95, sum by (job, le) (rate(http_request_duration_seconds_bucket{namespace="$namespace"}[5m])))'
                  seriesNameFormat: "{{job}}"
    
    # Row 2, Column 1: Span Metrics - Request Rate
    "1_0":
      kind: Panel
      spec:
        display:
          name: "Span Metrics - Request Rate"
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
              values: []
            visual:
              areaOpacity: 0
              connectNulls: false
              display: line
              lineWidth: 1
            yAxis:
              format:
                unit: decimal
              min: 0
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: observability-demo-prometheus
                  query: 'sum by (service_name) (rate(traces_spanmetrics_calls_total{namespace="$namespace"}[5m]))'
                  seriesNameFormat: "{{service_name}}"
    
    # Row 2, Column 2: Span Metrics - Error Rate
    "1_1":
      kind: Panel
      spec:
        display:
          name: "Span Metrics - Error Rate"
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
              values: []
            visual:
              areaOpacity: 0
              connectNulls: false
              display: line
              lineWidth: 1
            yAxis:
              format:
                unit: decimal
              min: 0
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: observability-demo-prometheus
                  query: 'sum by (service_name) (rate(traces_spanmetrics_calls_total{namespace="$namespace", status_code=~"5.*"}[5m]))'
                  seriesNameFormat: "{{service_name}}"
    
    # Row 3, Column 1: CPU Usage by Service
    "2_0":
      kind: Panel
      spec:
        display:
          name: "CPU Usage by Service"
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
              values: []
            visual:
              areaOpacity: 0
              connectNulls: false
              display: line
              lineWidth: 1
            yAxis:
              format:
                unit: decimal
              min: 0
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: observability-demo-prometheus
                  query: 'sum by (pod) (rate(container_cpu_usage_seconds_total{namespace="$namespace", container!=""}[5m]))'
                  seriesNameFormat: "{{pod}}"
    
    # Row 3, Column 2: Memory Usage by Service
    "2_1":
      kind: Panel
      spec:
        display:
          name: "Memory Usage by Service"
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
              values: []
            visual:
              areaOpacity: 0
              connectNulls: false
              display: line
              lineWidth: 1
            yAxis:
              format:
                unit: bytes
              min: 0
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: observability-demo-prometheus
                  query: 'sum by (pod) (container_memory_working_set_bytes{namespace="$namespace", container!=""})'
                  seriesNameFormat: "{{pod}}"
    
    # Row 4, Column 1: Background Worker - Success Rate
    "3_0":
      kind: Panel
      spec:
        display:
          name: "Background Worker - Success Rate"
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
              values: []
            visual:
              areaOpacity: 0
              connectNulls: false
              display: line
              lineWidth: 1
            yAxis:
              format:
                unit: decimal
              min: 0
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: observability-demo-prometheus
                  query: 'sum by (status) (rate(worker_requests_total{namespace="$namespace"}[5m]))'
                  seriesNameFormat: "{{status}}"
    
    # Row 4, Column 2: Python API - Seed Generation Latency
    "3_1":
      kind: Panel
      spec:
        display:
          name: "Python API - Seed Generation Latency (P95)"
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
              values: []
            visual:
              areaOpacity: 0
              connectNulls: false
              display: line
              lineWidth: 1
            yAxis:
              format:
                unit: seconds
              min: 0
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: observability-demo-prometheus
                  query: 'histogram_quantile(0.95, sum by (le) (rate(seed_generation_duration_seconds_bucket{namespace="$namespace"}[5m])))'
                  seriesNameFormat: "P95 Seed Generation Time"
  
  # Dashboard layout - defines panel positioning
  layouts:
    - kind: Grid
      spec:
        display:
          title: "Application Metrics"
          collapse:
            open: true
        items:
          # Row 1
          - x: 0
            y: 0
            width: 12
            height: 7
            content:
              $ref: "#/spec/panels/0_0"
          - x: 12
            y: 0
            width: 12
            height: 7
            content:
              $ref: "#/spec/panels/0_1"
          # Row 2
          - x: 0
            y: 7
            width: 12
            height: 7
            content:
              $ref: "#/spec/panels/1_0"
          - x: 12
            y: 7
            width: 12
            height: 7
            content:
              $ref: "#/spec/panels/1_1"
          # Row 3
          - x: 0
            y: 14
            width: 12
            height: 7
            content:
              $ref: "#/spec/panels/2_0"
          - x: 12
            y: 14
            width: 12
            height: 7
            content:
              $ref: "#/spec/panels/2_1"
          # Row 4
          - x: 0
            y: 21
            width: 12
            height: 7
            content:
              $ref: "#/spec/panels/3_0"
          - x: 12
            y: 21
            width: 12
            height: 7
            content:
              $ref: "#/spec/panels/3_1"
