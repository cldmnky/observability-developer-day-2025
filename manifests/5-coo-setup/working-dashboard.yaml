---
# Working Perses Dashboard for Observability Demo Applications
# Using actual metrics available from the applications
apiVersion: perses.dev/v1alpha1
kind: PersesDashboard
metadata:
  name: observability-demo-overview
  namespace: openshift-cluster-observability-operator
  labels:
    app.kubernetes.io/name: observability-demo
    monitoring.rhobs/stack: observability-stack
spec:
  display:
    name: "Observability Demo - Application Overview"
    description: "Overview of Go, Python, Quarkus, and Node.js microservices"
  duration: 1h
  variables:
    - kind: ListVariable
      spec:
        name: namespace
        allowAllValue: false
        allowMultiple: false
        display:
          hidden: false
          name: Namespace
          description: Application namespace
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: namespace
            datasource:
              kind: PrometheusDatasource
              name: observability-demo-prometheus
            matchers:
              - 'up{namespace=~".+"}'
        defaultValue: "observability-demo"
  
  layouts:
    - kind: Grid
      spec:
        items:
          - x: 0
            y: 0
            width: 12
            height: 6
            content:
              $ref: "#/spec/panels/0_0"
          - x: 12
            y: 0
            width: 12
            height: 6
            content:
              $ref: "#/spec/panels/0_1"
          - x: 0
            y: 6
            width: 12
            height: 6
            content:
              $ref: "#/spec/panels/1_0"
          - x: 12
            y: 6
            width: 12
            height: 6
            content:
              $ref: "#/spec/panels/1_1"
          - x: 0
            y: 12
            width: 12
            height: 6
            content:
              $ref: "#/spec/panels/2_0"
          - x: 12
            y: 12
            width: 12
            height: 6
            content:
              $ref: "#/spec/panels/2_1"
  
  panels:
    # Row 1, Column 1: Service Up Status
    "0_0":
      kind: Panel
      spec:
        display:
          name: "Service Availability"
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
              values: []
            visual:
              areaOpacity: 0
              connectNulls: false
              display: line
              lineWidth: 2
            yAxis:
              format:
                unit: decimal
              min: 0
              max: 1
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: observability-demo-prometheus
                  query: 'up{namespace="$namespace",job=~".*-api|.*-app"}'
                  seriesNameFormat: "{{job}}"
    
    # Row 1, Column 2: HTTP Server Request Rate (OpenTelemetry metrics)
    "0_1":
      kind: Panel
      spec:
        display:
          name: "HTTP Server Request Rate"
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
              values: []
            visual:
              areaOpacity: 0
              connectNulls: false
              display: line
              lineWidth: 1
            yAxis:
              format:
                unit: decimal
              min: 0
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: observability-demo-prometheus
                  query: 'sum by (service_name) (rate(http_server_duration_milliseconds_count{k8s_namespace_name="$namespace"}[5m]))'
                  seriesNameFormat: "{{service_name}}"
    
    # Row 2, Column 1: HTTP Server P95 Latency
    "1_0":
      kind: Panel
      spec:
        display:
          name: "HTTP P95 Latency (ms)"
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
              values: []
            visual:
              areaOpacity: 0
              connectNulls: false
              display: line
              lineWidth: 1
            yAxis:
              format:
                unit: decimal
              min: 0
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: observability-demo-prometheus
                  query: 'histogram_quantile(0.95, sum by (service_name, le) (rate(http_server_duration_milliseconds_bucket{k8s_namespace_name="$namespace"}[5m])))'
                  seriesNameFormat: "{{service_name}} P95"
    
    # Row 2, Column 2: Process CPU Usage (from application metrics)
    "1_1":
      kind: Panel
      spec:
        display:
          name: "Process CPU Seconds"
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
              values: []
            visual:
              areaOpacity: 0.3
              connectNulls: false
              display: line
              lineWidth: 1
            yAxis:
              format:
                unit: decimal
              min: 0
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: observability-demo-prometheus
                  query: 'rate(process_cpu_seconds_total{namespace="$namespace"}[5m])'
                  seriesNameFormat: "{{job}}"
    
    # Row 3, Column 1: Process Memory Usage (from application metrics)
    "2_0":
      kind: Panel
      spec:
        display:
          name: "Process Memory (RSS)"
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
              values: []
            visual:
              areaOpacity: 0.3
              connectNulls: false
              display: line
              lineWidth: 1
            yAxis:
              format:
                unit: bytes
              min: 0
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: observability-demo-prometheus
                  query: 'process_resident_memory_bytes{namespace="$namespace"}'
                  seriesNameFormat: "{{job}}"
    
    # Row 3, Column 2: Goroutines (Go API specific)
    "2_1":
      kind: Panel
      spec:
        display:
          name: "Go API - Goroutines"
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              mode: list
              position: bottom
              values: []
            visual:
              areaOpacity: 0
              connectNulls: false
              display: line
              lineWidth: 1
            yAxis:
              format:
                unit: decimal
              min: 0
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: observability-demo-prometheus
                  query: 'go_goroutines{namespace="$namespace",job="go-api"}'
                  seriesNameFormat: "Goroutines"
